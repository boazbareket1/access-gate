<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Access Gate · דף הדגמה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap">
<style>
  :root { --bg:#14161C; --card:#1F2230; --text:#F2F2F5; --muted:#A6A9B8; --accent:#F5A524; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:Rubik, system-ui, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:72px 16px 260px; display:flex; flex-direction:column; gap:16px; }
  h1 { margin:0; font-size:28px; }
  p { color:var(--muted); margin:0; line-height:1.6; }
  .item { background:var(--card); border-radius:14px; padding:16px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .item button { background:var(--accent); color:#14161C; border:0; border-radius:10px; padding:10px 16px; font:inherit; font-weight:700; cursor:pointer; min-height:44px; }
  .lock { font-size:13px; color:var(--muted); }
  #out { min-height:24px; color:var(--accent); }
  code { background:var(--card); padding:2px 6px; border-radius:6px; direction:ltr; display:inline-block; }
</style>
</head>
<body>
<main>
  <h1>כלי לדוגמה</h1>
  <p>דף הדגמה לתוסף הגישה. התג בפינה מראה את מצב הגישה, ולוח הבדיקה בתחתית מאפשר להזיז את הזמן ולסמלץ מכשירים. הכול מדומה: אין התחברות אמיתית ואין חיוב.</p>

  <div class="item"><div><div>תרגיל בסיסי</div><div class="lock">פתוח לכולם</div></div><button id="free">פתח</button></div>
  <div class="item"><div><div>ספריית התרגילים המלאה</div><div class="lock" data-lockline>דורש גישה מלאה</div></div><button id="pro1">פתח</button></div>
  <div class="item"><div><div>שמירת תרגול אישי</div><div class="lock" data-lockline>דורש גישה מלאה</div></div><button id="pro2">שמור</button></div>
  <div id="out" role="status"></div>
  <p>מצב נוכחי: <code id="state">…</code></p>
</main>

<script src="gate.js"></script>
<script>
  var out = document.getElementById('out');
  AccessGate.onChange(function (s) {
    document.getElementById('state').textContent = JSON.stringify(s);
    document.querySelectorAll('[data-lockline]').forEach(function (el) {
      el.textContent = s.hasAccess ? 'פתוח' : 'דורש גישה מלאה';
    });
  });
  AccessGate.init({
    toolId: 'demo-tool',
    toolName: 'הכלי לדוגמה',
    trialDays: 7,
    maxDevices: 2,
    features: ['כל ספריית התרגילים', 'שמירת תרגולים אישיים'],
    debug: true
  }).then(function (s) { document.getElementById('state').textContent = JSON.stringify(s); });

  document.getElementById('free').onclick = function () { out.textContent = 'נפתח התרגיל הבסיסי'; };
  document.getElementById('pro1').onclick = function () {
    if (!AccessGate.require('ספריית התרגילים המלאה')) return;
    out.textContent = 'נפתחה הספרייה המלאה';
  };
  document.getElementById('pro2').onclick = function () {
    if (!AccessGate.require('שמירת תרגול אישי')) return;
    out.textContent = 'התרגול נשמר';
  };
</script>
</body>
</html>
